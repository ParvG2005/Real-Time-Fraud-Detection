server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 add_header X-Content-Type-Options nosniff;
 add_header X-Frame-Options DENY;
 add_header Referrer-Policy same-origin;
 location /api/ { proxy_pass http://backend:8080; proxy_read_timeout 60s; }
 location /health { proxy_pass http://backend:8080; }
 location /ws { proxy_pass http://backend:8080; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 90s; }
 location / { try_files $uri $uri/ /index.html; }
}
